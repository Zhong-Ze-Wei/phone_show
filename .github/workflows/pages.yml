name: Publish product site

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/readme-assets/*.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check static JavaScript
        run: node --check site/demo.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site and README covers
        run: |
          mkdir -p _pages/assets
          cp -R site/. _pages/
          cp docs/readme-assets/banner-*.svg _pages/assets/
      - name: Upload product site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
